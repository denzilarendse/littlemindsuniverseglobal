*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#e0f2fe 0%,#fef3c7 100%);color:#1e293b;min-height:100vh}
#navbar{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.nav-logo{font-size:18px;font-weight:bold;color:#0284c7;cursor:pointer}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-links button{background:none;border:none;font-size:13px;cursor:pointer;padding:8px 10px;border-radius:10px}
#app{padding:16px;max-width:800px;margin:0 auto}
.hero{text-align:center;padding:30px 10px}
.hero h1{font-size:28px;color:#0284c7;margin-bottom:12px}
.hero p{font-size:15px;color:#475569;margin-bottom:20px}
.hero-btn{background:#0ea5e9;color:#fff;border:none;padding:14px 26px;font-size:15px;border-radius:25px;cursor:pointer;font-weight:bold;margin:5px}
.gold-btn{background:#fbbf24 !important;color:#92400e !important}
.section-title{text-align:center;font-size:22px;color:#0284c7;margin:25px 0 15px}
.islands-grid{display:grid;grid-template-columns:1fr;gap:16px}
.island-card{background:#fff;border-radius:22px;padding:20px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.08);cursor:pointer}
.island-card.foundation{border-top:8px solid #fbbf24}
.island-card.discovery{border-top:8px solid #4ade80}
.island-card.creator{border-top:8px solid #a78bfa}
.island-icon{font-size:45px;margin-bottom:10px}
.island-card h3{font-size:18px;margin-bottom:8px}
.island-card p{color:#64748b;font-size:13px;margin:8px 0 12px}
.island-btn{background:#0ea5e9;color:#fff;border:none;padding:10px 14px;border-radius:20px;cursor:pointer;font-weight:bold;margin:4px;font-size:13px}
.island-btn:disabled{background:#cbd5e1;cursor:not-allowed}
.badge{display:inline-block;padding:5px 12px;border-radius:15px;font-size:11px;font-weight:bold}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-green{background:#dcfce7;color:#166534}
.badge-purple{background:#ede9fe;color:#5b21b6}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;padding:16px;border-radius:18px;text-align:center;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.stat-icon{font-size:30px;margin-bottom:8px}
.stat-value{font-size:22px;font-weight:bold;color:#0284c7}
.stat-label{font-size:11px;color:#64748b}
.level-bar{height:14px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px auto;max-width:300px}
.level-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#0ea5e9)}
.skill-row{margin:12px 0}
.skill-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;font-weight:bold}
.skill-bar{height:12px;background:#e2e8f0;border-radius:8px;overflow:hidden}
.skill-fill{height:100%;background:linear-gradient(90deg,#4ade80,#0ea5e9);border-radius:8px;transition:width .5s}
.insight-card{background:#e0f2fe;border-radius:15px;padding:12px;margin:10px 0;font-size:14px}
.confetti{text-align:center;font-size:40px}
.confetti span{display:inline-block;animation:pulse 1s infinite}
.confetti span:nth-child(2){animation-delay:.2s}
.confetti span:nth-child(3){animation-delay:.4s}

.auth-switch a{color:#0ea5e9;cursor:pointer;font-weight:bold}

.milo-name{font-weight:bold;font-size:17px;flex:1}
.close-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}

.milo-msg{background:#e0f2fe;color:#1e293b}
.user-msg{background:#0ea5e9;color:#fff;margin-left:auto;text-align:right}

.milo-input-area button{background:#0ea5e9;color:#fff;border:none;padding:10px 14px;border-radius:18px;cursor:pointer;font-weight:bold}
.voice-btn{background:#fef3c7 !important;font-size:16px}
.listening{background:#fca5a5 !important;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.quiz-card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.08);margin:15px 0}
.quiz-q{font-size:18px;font-weight:bold;margin-bottom:15px;color:#0284c7}
.quiz-option{display:block;width:100%;background:#e0f2fe;border:none;padding:14px;border-radius:15px;margin-bottom:10px;font-size:16px;cursor:pointer;text-align:left}

.result-emoji{font-size:70px;text-align:center}

.badge-item{background:#fef3c7;padding:8px 14px;border-radius:15px;font-size:13px;font-weight:bold;color:#92400e}

<div id="milo-float" onclick="openMilo()">🦉</div>

    <div class="milo-header">
      <span class="milo-avatar">🦉</span>
      <span class="milo-name">Milo</span>
      <button onclick="toggleVoice()" id="voice-toggle" class="close-btn">🔊</button>

    </div>

    </div>
    <div class="milo-input-area">
      <input type="text" id="milo-input" placeholder="Ask Milo anything..." onkeypress="if(event.key==='Enter')sendToMilo()">
      <button onclick="startListening()" id="mic-btn" class="voice-btn">🎙️</button>
      <button onclick="sendToMilo()">Send</button>
    </div>
  </div>
</div>

/* ============ VOICE SYSTEM ============ */
var voiceEnabled = true;
var synth = window.speechSynthesis;
var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function cleanForSpeech(t){ return t.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,"").replace(/[\u2600-\u27BF]/g,"").trim(); }
function speak(text){ if(!voiceEnabled||!synth) return; synth.cancel(); var u=new SpeechSynthesisUtterance(cleanForSpeech(text)); u.rate=0.95; u.pitch=1.1; synth.speak(u); }
function toggleVoice(){ voiceEnabled=!voiceEnabled; if(!voiceEnabled&&synth){synth.cancel();} document.getElementById("voice-toggle").innerHTML=voiceEnabled?"🔊":""; }
function startListening(){
  if(!SpeechRec){ alert("Voice listening needs Chrome browser 🎙️"); return; }
  var mic=document.getElementById("mic-btn");
  function begin(){
    try{
      var rec=new SpeechRec(); rec.lang="en-US"; rec.continuous=false; rec.interimResults=false;
      mic.classList.add("listening");
      rec.onresult=function(e){ mic.classList.remove("listening"); document.getElementById("milo-input").value=e.results[0][0].transcript; sendToMilo(); };
      rec.onerror=function(e){ mic.classList.remove("listening"); var err=(e&&e.error)?e.error:"unknown";
        if(err==="no-speech"){ alert("Milo didn't hear anything 👂 Tap 🎙️ and speak clearly!"); }
        else if(err==="not-allowed"||err==="service-not-allowed"){ alert("Microphone is blocked 🔒\n\nFix: Chrome ⋮ → Settings → Site settings → Microphone → allow this site."); }
        else if(err==="network"){ alert("Voice needs internet 🌐 Check your data and try again."); }
        else if(err==="aborted"){ }
        else{ alert("Milo couldn't hear you ("+err+"). Try again! 🎙️"); } };
      rec.onend=function(){ mic.classList.remove("listening"); };
      rec.start();
    }catch(err){ mic.classList.remove("listening"); alert("Voice failed to start. Try again! 🎙️"); }
  }
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ stream.getTracks().forEach(function(t){t.stop();}); begin(); })
    .catch(function(){ alert("Microphone permission needed 🔒\n\nWhen Chrome asks, tap ALLOW, then press 🎙️ again."); });
  } else { begin(); }
}

var MILO_SYSTEM_PROMPT = "You are Milo, a friendly owl AI learning companion for children aged 2-12 on LittleMindsUniverse, a South African CAPS-aligned learning platform. Always be kind, encouraging, safe and age-appropriate. Give short, simple, fun explanations. Never share harmful, scary or adult content. Encourage curiosity and celebrate effort. Use a few emojis. If asked about something unsafe, gently redirect to a learning topic and suggest asking a trusted adult.";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function askRealMilo(message){
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + AI_CONFIG.model + ":generateContent?key=" + AI_CONFIG.key;
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: MILO_SYSTEM_PROMPT }] },
      contents: [{ parts: [{ text: message }] }],
      generationConfig: { maxOutputTokens: 200 }
    })
  }).then(function(r){
    if(!r.ok){ throw new Error("API " + r.status); }
    return r.json();
  }).then(function(data){
    var t = "";
    try { t = data.candidates[0].content.parts[0].text; } catch(e){ t = ""; }
    if(!t){ throw new Error("empty"); }
    return t;
  });
}
function sendToMilo(){
  var input = document.getElementById("milo-input");
  var message = input.value.trim();
  if(!message) return;
  var box = document.getElementById("milo-messages");
  box.innerHTML += '<div class="msg user-msg">' + esc(message) + '</div>';
  input.value = "";
  box.scrollTop = box.scrollHeight;
  var th = document.createElement("div");
  th.className = "msg milo-msg";
  th.innerHTML = "🦉 Milo is thinking...";
  box.appendChild(th);
  box.scrollTop = box.scrollHeight;
  function show(reply){
    if(th.parentNode){ th.parentNode.removeChild(th); }
    box.innerHTML += '<div class="msg milo-msg">' + esc(reply) + '</div>';
    box.scrollTop = box.scrollHeight;
    speak(reply);
  }
  if(AI_CONFIG.enabled && AI_CONFIG.key && AI_CONFIG.key.length > 20){
    askRealMilo(message).then(show).catch(function(){ show(MiloService.respond(message)); });
  } else {
    setTimeout(function(){ show(MiloService.respond(message)); }, 400);
  }
}

    else{ html+='<button class="island-btn" disabled>🔒 M'+s+'</button>'; }

function startWeek(island, month, week){
  if(month>1 && !StorageService.isPremium()){ App.showPage("subscribe"); return; }
  currentQuiz={island:island, month:month, week:week, index:0, score:0, done:false, skills:{}, mistakes:{}};
  App.showPage("quiz");
}
function monthComplete(island, month){
  var weeks=CURRICULUM[island].months[month-1].weeks;
  for(var w=1;w<=weeks.length;w++){ if(!StorageService.weekPassed(island+"-"+month+"-"+w)) return false; }
  return true;
}
function answerQuiz(i){
  if(!currentQuiz||currentQuiz.done) return;
  var weekData=CURRICULUM[currentQuiz.island].months[currentQuiz.month-1].weeks[currentQuiz.week-1];
  var q=weekData.questions[currentQuiz.index];
  if(i===q.answer){
    currentQuiz.score++;
    StorageService.addStars(10);
    StorageService.addSkill(q.subject);
    currentQuiz.skills[q.subject]=(currentQuiz.skills[q.subject]||0)+1;
  } else {
    currentQuiz.mistakes[q.subject]=(currentQuiz.mistakes[q.subject]||0)+1;
  }
  currentQuiz.index++;
  if(currentQuiz.index>=weekData.questions.length){
    var passed=currentQuiz.score>=3;
    var key=currentQuiz.island+"-"+currentQuiz.month+"-"+currentQuiz.week;
    StorageService.saveReport(key,{ theme:weekData.theme, island:currentQuiz.island, month:currentQuiz.month, week:currentQuiz.week, correct:currentQuiz.score, total:weekData.questions.length, skills:currentQuiz.skills, mistakes:currentQuiz.mistakes, date:Date.now() });
    if(passed){
      StorageService.addStars(20);
      StorageService.passWeek(key);
      StorageService.completeActivity();
      if(monthComplete(currentQuiz.island,currentQuiz.month)){
        StorageService.addAchievement(CURRICULUM[currentQuiz.island].months[currentQuiz.month-1].badge);
        if(currentQuiz.month<6){ StorageService.unlockStage(currentQuiz.island); }
      }
    }
    currentQuiz.done=true;
    speak(passed ? "Week complete! Great work, Explorer!" : "Good try! Let's practise again!");
  }
  App.showPage("quiz");
}

    '<div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="Create a password"></div>'+
    '<div class="form-group"><label>I am a...</label><select id="reg-role"><option value="parent">👨‍👩‍ Parent</option><option value="child">🧒 Child (with parent)</option></select></div>'+
    '<button class="auth-btn" onclick="handleRegister()">Create Account 🌟</button>'+
    '<div class="auth-switch">Already have an account? <a onclick="navigate(\'login\')">Login</a></div></div>';
  },
  renderSubscribe:function(){
    var sub=StorageService.getSubscription();
    if(sub.active && sub.plan!=="free"){
      return '<div class="quiz-card" style="text-align:center"><div class="result-emoji">👑</div>'+
      '<h2 style="color:#0284c7">Premium Active!</h2><p>Current plan: <strong>'+(sub.plan==="monthly"?"R100 / month (recurring)":"R1000 / year")+'</strong></p>'+
      '<p>All CAPS months on ALL islands unlocked! 🇿🇦</p><button class="hero-btn" onclick="navigate(\'islands\')">Continue Learning 🏝️</button></div>';
    }
    return '<h2 class="section-title">🇿🇦 Unlock the FULL CAPS Journey!</h2>'+
    '<div class="quiz-card"><p style="text-align:center">Month 1 (4 weekly adventures) is <strong>FREE forever</strong>.<br>Unlock <strong>Months 2-6</strong> — a full school year of weekly CAPS games + reports: 👇</p></div>'+
    '<div class="islands-grid">'+
    '<div class="island-card discovery"><div class="island-icon">🌈</div><h3>Monthly</h3><p style="font-size:24px;font-weight:bold;color:#0284c7">R100<span style="font-size:13px"> / month</span></p><span class="badge badge-green">Recurring billing</span><p>✅ All 6 CAPS months, all islands<br>✅ Weekly adventures + reports<br>✅ Voice Milo 🎙️<br>✅ Parent CAPS reports 📊</p><button class="island-btn" onclick="subscribe(\'monthly\')">Start Monthly 💳</button></div>'+
    '<div class="island-card creator"><div class="island-icon">👑</div><h3>Yearly</h3><p style="font-size:24px;font-weight:bold;color:#0284c7">R1000<span style="font-size:13px"> / year</span></p><span class="badge badge-purple">2 months FREE!</span><p>✅ Everything in Monthly<br>✅ Covers a full school year<br>✅ Save R200 every year</p><button class="island-btn" onclick="subscribe(\'yearly\')">Start Yearly 💳</button></div></div>'+
    '<p style="text-align:center;font-size:12px;color:#64748b;margin-top:15px">🔐 Secure payment • Cancel anytime<br>MVP simulation — real gateway (PayFast/Yoco) at launch.</p>';
  },
  renderDashboard:function(){
    var user=AuthService.getCurrentUser();
    if(!user){ return '<div class="auth-container"><h2>🔐 Login Required</h2><button class="auth-btn" onclick="navigate(\'login\')">Login</button></div>'; }
    var p=StorageService.getProgress(); var ach=StorageService.getAchievements();
    var level=Math.floor(p.stars/100)+1; var toNext=100-(p.stars%100);
    var badgeHTML=ach.length? '<div class="badge-list">'+ach.map(function(a){return '<span class="badge-item">🏆 '+a+'</span>';}).join("")+'</div>' : '<p style="color:#64748b;font-size:13px;text-align:center">Complete CAPS weeks to earn badges!</p>';
    var planLine=StorageService.isPremium() ? '👑 Premium active — all CAPS months unlocked!' : '🌟 Free plan — Month 1 free. <a onclick="navigate(\'subscribe\')" style="color:#0ea5e9;font-weight:bold;cursor:pointer">Go Premium</a>';
    return '<div style="text-align:center;margin:20px 0"><h2 style="color:#0284c7">👋 Welcome, '+user.name+'!</h2><p>Ready for this week\'s CAPS adventure? 🇿</p></div>'+
    '<div class="stats-grid">'+
    '<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value">'+p.stars+'</div><div class="stat-label">Stars Earned</div></div>'+
    '<div class="stat-card"><div class="stat-icon">🌟</div><div class="stat-value">Level '+level+'</div><div class="stat-label">Explorer Level</div></div>'+
    '<div class="stat-card"><div class="stat-icon">📚</div><div class="stat-value">'+p.activitiesCompleted+'</div><div class="stat-label">Weeks Done</div></div>'+
    '<div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-value">'+ach.length+'</div><div class="stat-label">Badges</div></div></div>'+
    '<div class="level-bar"><div class="level-fill" style="width:'+(p.stars%100)+'%"></div></div>'+
    '<p style="text-align:center;font-size:12px;color:#64748b">'+toNext+' stars until Level '+(level+1)+' 🚀</p>'+
    '<p style="text-align:center;font-size:13px;color:#64748b;margin-top:8px">'+planLine+'</p>'+
    '<h2 class="section-title">🏆 My Badge Collection</h2>'+badgeHTML+
    '<h2 class="section-title">🌈 Continue Learning</h2><div class="islands-grid">'+
    '<div class="island-card foundation" onclick="navigate(\'islands\')"><div class="island-icon">🌱</div><h3>Foundation</h3><button class="island-btn">Play</button></div>'+
    '<div class="island-card discovery" onclick="navigate(\'islands\')"><div class="island-icon">🔍</div><h3>Discovery</h3><button class="island-btn">Play</button></div>'+
    '<div class="island-card creator" onclick="navigate(\'islands\')"><div class="island-icon">🚀</div><h3>Creator</h3><button class="island-btn">Play</button></div></div>';
  },
  renderParent:function(){
    var user=AuthService.getCurrentUser();
    if(!user){ return '<div class="auth-container"><h2>🔐 Login Required</h2><button class="auth-btn" onclick="navigate(\'login\')">Login</button></div>'; }
    var p=StorageService.getProgress();
    var strong=null, weak=null;
    for(var k in p.skills){ if(strong===null||p.skills[k]>p.skills[strong]){strong=k;} if(weak===null||p.skills[k]<p.skills[weak]){weak=k;} }
    var chart="";
    for(var s in p.skills){ var val=p.skills[s]; var width=Math.min(100,val*20);
      chart+='<div class="skill-row"><div class="skill-label"><span>'+(CONFIG.skillIcons[s]||"🌟")+' '+s.toUpperCase()+'</span><span>'+val+' correct</span></div><div class="skill-bar"><div class="skill-fill" style="width:'+width+'%"></div></div></div>'; }
    var insight="Complete some weekly adventures and Milo will share learning insights! 🌱";
    if(strong && p.skills[strong]>0){
      insight="Your explorer is strongest in "+strong.toUpperCase()+" "+(CONFIG.skillIcons[strong]||"")+"! "+(p.skills[weak]===0?"Try a "+weak.toUpperCase()+" adventure next to unlock new CAPS skills! 🌱":"Keep balancing CAPS subjects with varied adventures! 🌈");
    }
    /* WEEKLY REPORTS */
    var reports=StorageService.getReports();
    var keys=Object.keys(reports).sort(function(a,b){ return reports[b].date-reports[a].date; });
    var repHTML="";
    if(!keys.length){ repHTML='<p style="color:#64748b;font-size:13px;text-align:center">No weekly reports yet — complete a week to see the first one! 📅</p>'; }
    for(var i=0;i<keys.length;i++){
      var r=reports[keys[i]];
      var mastered=[], struggled=[];
      for(var ms in r.skills){ if((r.mistakes[ms]||0)===0 && r.skills[ms]>0) mastered.push(ms); }
      for(var st2 in r.mistakes){ if(r.mistakes[st2]>0) struggled.push(st2); }
      var sugg=struggled.length ? (SUGGESTIONS[struggled[0]]||"Practise "+struggled[0]+" together this week!") : "Fantastic week! Try the next weekly adventure to keep growing! 🌟";
      repHTML+='<div class="quiz-card"><h3 style="color:#0284c7">📅 '+r.theme+'</h3>'+
      '<p style="font-size:12px;color:#64748b">'+CONFIG.islands[r.island].name+' • Month '+r.month+' • Week '+r.week+' • Score '+r.correct+'/'+r.total+'</p>'+
      '<p style="font-size:13px">📚 <strong>Learnt this week:</strong> '+Object.keys(r.skills).concat(Object.keys(r.mistakes)).filter(function(v,idx,arr){return arr.indexOf(v)===idx;}).join(", ")+'</p>'+
      '<p style="font-size:13px">✅ <strong>Mastered:</strong> '+(mastered.length?mastered.join(", "):"still growing")+'</p>'+
      '<p style="font-size:13px">⚠️ <strong>Struggled with:</strong> '+(struggled.length?struggled.join(", "):"nothing — amazing! 🎉")+'</p>'+
      '<p style="font-size:13px">💡 <strong>Suggestion:</strong> '+sugg+'</p></div>';
    }
    return '<div style="text-align:center;margin:20px 0"><h2 style="color:#0284c7">👨‍👩‍ Parent Dashboard</h2><p>Family learning insights • CAPS-aligned 🇿🇦</p></div>'+
    '<div class="stats-grid">'+
    '<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value">'+p.stars+'</div><div class="stat-label">Total Stars</div></div>'+
    '<div class="stat-card"><div class="stat-icon">📚</div><div class="stat-value">'+p.activitiesCompleted+'</div><div class="stat-label">Weeks Done</div></div></div>'+
    '<h2 class="section-title">📅 Weekly Progress Reports</h2>'+repHTML+
    '<div class="quiz-card"><h3 style="color:#0284c7;margin-bottom:10px">📊 CAPS Skill Growth Chart</h3>'+chart+'</div>'+
    '<div class="insight-card">🦉 <strong>Milo Insight:</strong> '+insight+'</div>'+
    '<h2 class="section-title">🇿🇦 6-Month CAPS Curriculum Map</h2>'+
    capsCard("foundation")+capsCard("discovery")+capsCard("creator")+
    '<div class="insight-card">🛡️ <strong>Safety:</strong> Child-safe AI • Parent controls active • Data stored only on this device.</div>';
  },
  renderIslands:function(){
    var f=CONFIG.islands.foundation,d=CONFIG.islands.discovery,c=CONFIG.islands.creator;
    return '<h2 class="section-title">🏝️ Choose Island & CAPS Month</h2><div class="islands-grid">'+
    '<div class="island-card foundation"><div class="island-icon">'+f.icon+'</div><h3>'+f.name+'</h3><span class="badge badge-yellow">Ages '+f.ages+' • Grade R</span>'+monthButtons('foundation')+'</div>'+
    '<div class="island-card discovery"><div class="island-icon">'+d.icon+'</div><h3>'+d.name+'</h3><span class="badge badge-green">Ages '+d.ages+' • Gr 1-3</span>'+monthButtons('discovery')+'</div>'+
    '<div class="island-card creator"><div class="island-icon">'+c.icon+'</div><h3>'+c.name+'</h3><span class="badge badge-purple">Ages '+c.ages+' • Gr 4-6</span>'+monthButtons('creator')+'</div></div>';
  },
  renderMonthView:function(){
    if(!currentMonth){ return this.renderIslands(); }
    var data=CURRICULUM[currentMonth.island];
    var m=data.months[currentMonth.month-1];
    if(!m.weeks.length){
      return '<div class="quiz-card" style="text-align:center"><div class="result-emoji">📦</div><h2 style="color:#0284c7">New Adventures Coming Soon!</h2><p>This month\'s CAPS content arrives in the next content drop.</p><button class="hero-btn" onclick="navigate(\'islands\')">Back to Islands 🏝️</button></div>';
    }
    var html='<h2 class="section-title">'+data.title+' — '+m.name+'</h2><span class="caps-tag">🇿 CAPS: '+m.caps+'</span>';
    for(var w=0;w<m.weeks.length;w++){
      var wk=m.weeks[w]; var key=currentMonth.island+"-"+currentMonth.month+"-"+(w+1);
      var passed=StorageService.weekPassed(key);
      var unlocked=(w===0)||StorageService.weekPassed(currentMonth.island+"-"+currentMonth.month+"-"+w);
      html+='<div class="quiz-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="font-size:14px"><strong>Week '+(w+1)+':</strong> '+wk.theme+'</div>'+
      (passed?'<span class="badge badge-green">✅ Done</span>': unlocked?'<button class="island-btn" onclick="startWeek(\''+currentMonth.island+'\','+currentMonth.month+','+(w+1)+')">Play ▶️</button>':'<span class="badge badge-yellow">🔒 Finish previous week</span>')+
      '</div></div>';
    }
    html+='<div style="text-align:center"><button class="hero-btn" onclick="navigate(\'islands\')">Back ️</button></div>';
    return html;
  },
  renderQuiz:function(){
    if(!currentQuiz){ return this.renderIslands(); }
    var data=CURRICULUM[currentQuiz.island];
    var weekData=data.months[currentQuiz.month-1].weeks[currentQuiz.week-1];
    if(currentQuiz.done){
      var total=weekData.questions.length;
      var passed=currentQuiz.score>=3;
      var perfect=currentQuiz.score===total;
      var earned=currentQuiz.score*10+(passed?20:0);
      var html='<div class="quiz-card" style="text-align:center">'+
      (perfect&&passed?'<div class="confetti"><span>🎉</span><span>🌟</span><span>🎊</span></div>':'<div class="result-emoji">'+(passed?'🎉':'🌱')+'</div>')+
      '<h2 style="color:#0284c7">'+(passed?'Week Complete!':'Keep Trying!')+'</h2>'+
      '<p>'+weekData.theme+' • '+currentQuiz.score+' / '+total+' correct</p>'+
      '<p style="font-size:20px;font-weight:bold;color:#92400e">+'+earned+' ⭐</p>';
      if(passed){
        html+='<div class="milo-feedback">🦉 Milo: "AMAZING! Your weekly report is ready for Mom/Dad! 📅"</div>';
        if(currentQuiz.week<4){
          html+='<button class="hero-btn" onclick="openMonth(\''+currentQuiz.island+'\','+currentQuiz.month+')">Next Week ➡️</button>';
        } else {
          html+='<div class="milo-feedback">🦉 Milo: "Month complete! You are a CAPS CHAMPION! 🏆🇿🇦"</div>'+
          '<button class="hero-btn" onclick="navigate(\'islands\')">Islands 🏝️</button>';
        }
      } else {
        html+='<div class="milo-feedback">🦉 Milo: "Score 3/4 to complete this week. You can do it! 💪"</div>';
      }
      html+='<button class="hero-btn" onclick="startWeek(\''+currentQuiz.island+'\','+currentQuiz.month+','+currentQuiz.week+')">Play Again 🔄</button>'+
      '<button class="hero-btn" onclick="openMonth(\''+currentQuiz.island+'\','+currentQuiz.month+')">Weeks 📅</button></div>';
      return html;
    }
    var q=weekData.questions[currentQuiz.index];
    var html='<h2 class="section-title">'+weekData.theme+'</h2><div class="quiz-card">'+
    '<span class="caps-tag">🇿🇦 CAPS: '+data.months[currentQuiz.month-1].caps+' • '+data.months[currentQuiz.month-1].name+' Week '+currentQuiz.week+'</span>'+
    '<div class="quiz-progress"><span>Game '+(currentQuiz.index+1)+' / '+weekData.questions.length+'</span><span>Score: '+currentQuiz.score+' ✅</span></div>'+
    '<div class="quiz-q">'+q.q+'</div>';
    for(var i=0;i<q.options.length;i++){ html+='<button class="quiz-option" onclick="answerQuiz('+i+')">'+q.options[i]+'</button>'; }
    html+='</div><div class="milo-feedback">🦉 Milo: Take your time, Explorer! I believe in you! 💪</div>';
    return html;
  }
};
